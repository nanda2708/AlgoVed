# Local development: MongoDB + compiler in containers, run the backend and
# frontend with `npm run dev`. Or point MONGO_URI at Atlas and skip `mongo`.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  compiler:
    build: ../compiler
    restart: unless-stopped
    environment:
      PORT: 8000
      COMPILER_API_KEY: ${COMPILER_API_KEY:?set COMPILER_API_KEY in your environment}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    mem_limit: 1g
    pids_limit: 256

volumes:
  mongo_data:
