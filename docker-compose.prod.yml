services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  compiler:
    build:
      context: ./compiler
    image: algoved-compiler:latest
    restart: unless-stopped
    environment:
      PORT: 8000
      COMPILER_API_KEY: ${COMPILER_API_KEY:?set COMPILER_API_KEY}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}

  backend:
    build:
      context: ./backend
    image: algoved-backend:latest
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/algoved
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NEXT_PUBLIC_CLIENT_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      COMPILER_API_URL: http://compiler:8000
      COMPILER_API_KEY: ${COMPILER_API_KEY:?set COMPILER_API_KEY}
    depends_on:
      - mongo
      - compiler

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?set PUBLIC_URL}
    image: algoved-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
