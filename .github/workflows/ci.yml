name: AlgoVed CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_COMPILER_API_URL: http://localhost:8000
          NEXT_PUBLIC_CLIENT_URL: http://localhost:3000

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check index.js
      - run: node --check config/db.js
      - run: node --check controllers/submission.js

  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: compiler/package-lock.json
      - run: npm ci
      - run: node --check index.js
      - run: node --check executeCpp.js
      - run: node --check aiCodeReview.js
